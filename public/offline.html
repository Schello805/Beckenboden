<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#244f40">
  <title>Stärke deine Mitte · Kurzes Update</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f8f5ed,#e5eee7);color:#203a31;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,460px);padding:36px 28px;background:rgba(255,255,255,.92);border:1px solid #cbd7cf;box-shadow:0 18px 50px rgba(32,58,49,.12);text-align:center}.logo{width:70px;height:70px}.eyebrow{margin:20px 0 8px;color:#70847c;font-size:.75rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:0 0 14px;font-family:Georgia,serif;font-size:clamp(2rem,8vw,3rem);font-weight:500}p{margin:0 auto 24px;max-width:34ch;color:#5d7068;line-height:1.55}button{min-height:48px;padding:0 24px;border:0;background:#244f40;color:#fff;font:700 1rem system-ui;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo-kraftbaum.svg" alt="">
    <div class="eyebrow">Einen Augenblick</div>
    <h1>Die App wird aktualisiert</h1>
    <p>Deine Daten sind sicher. Wir verbinden dich automatisch wieder, sobald die neue Version bereitsteht.</p>
    <button type="button" onclick="location.reload()">Jetzt erneut versuchen</button>
  </main>
  <script>setTimeout(function(){location.reload()},3000)</script>
</body>
</html>
